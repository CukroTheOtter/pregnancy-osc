[package]
name = "pregsys-companion"
version = "0.3.1"
description = "Pregnancy OSC"
edition = "2021"
default-run = "pregsys-companion"

[lib]
name = "pregsys_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
log = "0.4.34"
pregsys-core = { version = "0.1.0", path = "../crates/pregsys-core" }
pregsys-osc = { version = "0.1.0", path = "../crates/pregsys-osc" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"
ureq = "3.4.2"
