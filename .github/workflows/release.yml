# Tests, builds, signs and publishes a release when a version tag (v1.2.3) is pushed.
#   Tests -> Build (Windows, Linux) -> Summary
# scripts/release.ps1 makes the tag. Needs the repo secrets
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build (${{ matrix.name }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      # The release notes are the tag's message (checkout drops it, so fetch it again).
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          {
            echo "body<<EOF"
            git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore compiled crates
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # Keep compiled crates even if signing fails, so a retry is quick.
          cache-on-failure: true

      - name: Install packages
        run: npm ci

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false

  summary:
    name: Summary
    needs: [tests, build]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Write the results
        env:
          TESTS: ${{ needs.tests.result }}
          BUILD: ${{ needs.build.result }}
          RELEASE: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          icon() { case "$1" in success) echo "✅ Passed";; skipped) echo "⏭️ Skipped";; cancelled) echo "🚫 Cancelled";; *) echo "❌ Failed";; esac; }
          {
            echo "## Release ${GITHUB_REF_NAME}"
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Tests | $(icon "$TESTS") |"
            echo "| Build, sign and publish (Windows and Linux) | $(icon "$BUILD") |"
            if [ "$BUILD" = success ]; then echo; echo "[Open the release]($RELEASE)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$TESTS" = success ] && [ "$BUILD" = success ]
